[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-speech-detector"
version = "0.1.0"
description = "Multimodal (audio + transcript + enrolled speaker) device-directed speech detection, optimized for on-device use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
viz = ["matplotlib>=3.8"]
pretrained = ["transformers>=4.40"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pre-commit>=3.7"]
all = ["directed-speech-detector[serve,export,viz,dev]"]

[project.scripts]
dsd = "directed_speech_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that train a model (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501", "RUF012", "RUF007", "RUF046", "RUF059"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
ignore_missing_imports = true
files = ["src"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["onnx.*", "onnxruntime.*", "matplotlib.*"]
follow_imports = "skip"
